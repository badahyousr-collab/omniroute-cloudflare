name: Deploy OmniRoute to Cloudflare

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Cloudflare Container
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          node --version
          npm --version
          docker --version
          df -h

      - name: Free disk safely before Docker build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/heroku
          sudo apt-get clean
          sudo docker system prune -af --volumes || true
          rm -rf ~/.npm/_cacache ~/.cache || true
          df -h

      - name: Build & Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
